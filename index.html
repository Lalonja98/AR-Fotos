<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escanea tus recuerdos ✨</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      padding: 30px;
      box-sizing: border-box;

      color: white;

      background:
        radial-gradient(
          circle at top,
          #252525 0%,
          #0d0d0d 55%,
          #000 100%
        );
    }

    #intro h1 {
      font-size: 30px;
      margin: 0 0 18px;
    }

    #intro p {
      max-width: 330px;
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.85;
      margin: 0 0 30px;
    }

    #startButton {
      border: none;
      border-radius: 30px;

      padding: 15px 32px;

      font-size: 17px;
      font-weight: bold;

      color: #111;
      background: white;
    }

    #soundButton {
      position: fixed;
      z-index: 10000;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      display: none;

      border: none;
      border-radius: 25px;

      padding: 12px 20px;

      font-size: 15px;

      background: rgba(255,255,255,0.95);
      color: #111;
    }

    #errorBox {
      position: fixed;
      z-index: 20000;

      left: 15px;
      right: 15px;
      bottom: 20px;

      display: none;

      padding: 15px;

      border-radius: 12px;

      background: rgba(120,0,0,0.95);
      color: white;

      font-size: 14px;
      line-height: 1.4;

      word-break: break-word;
    }
  </style>
</head>

<body>

  <!-- PANTALLA DE INICIO -->

  <div id="intro">

    <h1>✨ Escanea tus recuerdos ✨</h1>

    <p>
      Apunta tu cámara a una de las fotos y descubre el recuerdo que guarda.
    </p>

    <button id="startButton">
      Comenzar
    </button>

  </div>


  <!-- BOTÓN DE AUDIO -->

  <button id="soundButton">
    🔊 Activar sonido
  </button>


  <!-- CAJA DE ERROR -->

  <div id="errorBox"></div>


  <!-- ========================= -->
  <!--         MINDAR             -->
  <!-- ========================= -->

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: no;
      uiLoading: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ========================= -->
    <!--          VIDEOS             -->
    <!-- ========================= -->

    <a-assets>

      <video
        id="Sayra"
        src="./Sayra.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Primo"
        src="./Primo.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Amiga"
        src="./Amiga.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Lupe"
        src="./Lupe.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Tio2"
        src="./Tio2.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Tia"
        src="./Tia.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Pelon"
        src="./Pelon.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Tio"
        src="./Tío.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="PrimaH"
        src="./PrimaH.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Dana"
        src="./Dana.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="PrimaSe"
        src="./PrimaSe.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Abuelo"
        src="./Abuelo.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <video
        id="Adrian"
        src="./Adrian.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>


    <!-- ========================= -->
    <!--          CÁMARA            -->
    <!-- ========================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- ========================= -->
    <!--        TARGET 0             -->
    <!--          SAYRA              -->
    <!-- ========================= -->

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#Sayra"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 1 - PRIMO -->

    <a-entity mindar-image-target="targetIndex: 1">

      <a-video
        src="#Primo"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 2 - AMIGA -->

    <a-entity mindar-image-target="targetIndex: 2">

      <a-video
        src="#Amiga"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 3 - LUPE -->

    <a-entity mindar-image-target="targetIndex: 3">

      <a-video
        src="#Lupe"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 4 - TIO2 -->

    <a-entity mindar-image-target="targetIndex: 4">

      <a-video
        src="#Tio2"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 5 - TIA -->

    <a-entity mindar-image-target="targetIndex: 5">

      <a-video
        src="#Tia"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 6 - PELON -->

    <a-entity mindar-image-target="targetIndex: 6">

      <a-video
        src="#Pelon"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 7 - TÍO -->

    <a-entity mindar-image-target="targetIndex: 7">

      <a-video
        src="#Tio"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 8 - MADRE -->
    <!-- RESERVADO POR AHORA -->


    <!-- TARGET 9 - PRIMAH -->

    <a-entity mindar-image-target="targetIndex: 9">

      <a-video
        src="#PrimaH"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 10 - DANA -->

    <a-entity mindar-image-target="targetIndex: 10">

      <a-video
        src="#Dana"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 11 - PRIMASE -->

    <a-entity mindar-image-target="targetIndex: 11">

      <a-video
        src="#PrimaSe"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 12 - ABUELO -->

    <a-entity mindar-image-target="targetIndex: 12">

      <a-video
        src="#Abuelo"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>


    <!-- TARGET 13 - ADRIAN -->

    <a-entity mindar-image-target="targetIndex: 13">

      <a-video
        src="#Adrian"
        width="1"
        height="1.777"
        position="0 0 0">
      </a-video>

    </a-entity>

  </a-scene>


  <!-- ========================= -->
  <!--          JAVASCRIPT         -->
  <!-- ========================= -->

  <script>

    const intro =
      document.getElementById("intro");

    const startButton =
      document.getElementById("startButton");

    const soundButton =
      document.getElementById("soundButton");

    const errorBox =
      document.getElementById("errorBox");

    const sceneEl =
      document.querySelector("a-scene");

    let activeVideo = null;


    /*
     * MOSTRAR ERRORES DE MINDAR
     */

    sceneEl.addEventListener("arError", function(event) {

      console.error("MINDAR ERROR:", event);

      errorBox.style.display = "block";

      errorBox.innerHTML =
        "<strong>⚠️ Error de cámara / MindAR</strong><br>" +
        "No se pudo iniciar la cámara.<br><br>" +
        "Revisa que Chrome tenga permiso para usar la cámara en esta página.";

      startButton.disabled = false;

      startButton.textContent =
        "Intentar de nuevo";

    });


    /*
     * CUANDO MINDAR YA ESTÁ LISTO
     */

    sceneEl.addEventListener("arReady", function() {

      console.log(
        "✅ MindAR inició correctamente"
      );

      intro.style.display = "none";

      errorBox.style.display = "none";

    });


    /*
     * BOTÓN COMENZAR
     */

    startButton.addEventListener(
      "click",
      async function() {

        try {

          console.log(
            "Iniciando MindAR..."
          );

          startButton.disabled = true;

          startButton.textContent =
            "Iniciando cámara...";


          const mindarSystem =
            sceneEl.systems[
              "mindar-image-system"
            ];


          if (!mindarSystem) {

            throw new Error(
              "No se encontró mindar-image-system"
            );

          }


          await mindarSystem.start();


          console.log(
            "MindAR.start() ejecutado"
          );


        } catch(error) {

          console.error(
            "ERROR AL INICIAR MINDAR:",
            error
          );


          errorBox.style.display =
            "block";


          errorBox.innerHTML =
            "<strong>⚠️ No se pudo iniciar</strong><br>" +
            error.message;


          startButton.disabled =
            false;


          startButton.textContent =
            "Intentar de nuevo";

        }

      }
    );


    /*
     * CONFIGURAR TARGETS
     */

    function setupTarget(
      targetIndex,
      videoId
    ) {

      const target =
        document.querySelector(
          '[mindar-image-target="targetIndex: ' +
          targetIndex +
          '"]'
        );


      const video =
        document.getElementById(
          videoId
        );


      if (!target || !video) {

        console.warn(
          "Target/video no encontrado:",
          targetIndex,
          videoId
        );

        return;

      }


      /*
       * FOTO ENCONTRADA
       */

      target.addEventListener(
        "targetFound",
        function() {

          console.log(
            "TARGET ENCONTRADO:",
            targetIndex,
            videoId
          );


          activeVideo =
            video;


          video.currentTime =
            0;


          video.muted =
            true;


          video.play().catch(
            function(error) {

              console.log(
                "Autoplay bloqueado:",
                error
              );

            }
          );


          soundButton.style.display =
            "block";

        }
      );


      /*
       * FOTO PERDIDA
       */

      target.addEventListener(
        "targetLost",
        function() {

          console.log(
            "TARGET PERDIDO:",
            targetIndex
          );


          video.pause();


          if (activeVideo === video) {

            activeVideo =
              null;

            soundButton.style.display =
              "none";

          }

        }
      );

    }


    /*
     * LOS 13 TARGETS ACTIVOS
     */

    setupTarget(0, "Sayra");

    setupTarget(1, "Primo");

    setupTarget(2, "Amiga");

    setupTarget(3, "Lupe");

    setupTarget(4, "Tio2");

    setupTarget(5, "Tia");

    setupTarget(6, "Pelon");

    setupTarget(7, "Tio");

    setupTarget(9, "PrimaH");

    setupTarget(10, "Dana");

    setupTarget(11, "PrimaSe");

    setupTarget(12, "Abuelo");

    setupTarget(13, "Adrian");


    /*
     * ACTIVAR AUDIO
     */

    soundButton.addEventListener(
      "click",
      async function() {

        if (!activeVideo)
          return;


        activeVideo.muted =
          false;


        try {

          await activeVideo.play();

          soundButton.style.display =
            "none";

        } catch(error) {

          console.error(
            "Error activando audio:",
            error
          );

        }

      }
    );

  </script>

</body>
</html>
