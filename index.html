<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 18px;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="info">
    Apunta a una de las fotos...
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"></a-entity>
    <a-entity mindar-image-target="targetIndex: 7"></a-entity>

  </a-scene>

  <script>
    const info = document.getElementById("info");

    document.querySelectorAll("[mindar-image-target]").forEach((target, index) => {

      target.addEventListener("targetFound", () => {

        info.innerHTML =
          "📸 FOTO DETECTADA<br><br>" +
          "TARGET INDEX: <strong>" + index + "</strong>";

        console.log("TARGET INDEX:", index);
      });

      target.addEventListener("targetLost", () => {
        info.innerHTML = "Apunta a otra foto...";
      });

    });
  </script>

</body>
</html>
