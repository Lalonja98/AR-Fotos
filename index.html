<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Fotos</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #mensaje {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 10;
      text-shadow: 0 2px 4px black;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="mensaje">Apunta la cámara a la foto 📷</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="miVideo"
        src="./video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#miVideo"
        position="0 0 0"
        rotation="0 0 0"
        width="1"
        height="0.5625">
      </a-video>

    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector("#miVideo");
    const mensaje = document.querySelector("#mensaje");

    document.querySelector("a-entity[mindar-image-target]")
      .addEventListener("targetFound", () => {
        mensaje.textContent = "¡Foto detectada! 🎬";
        video.play().catch(() => {});
      });

    document.querySelector("a-entity[mindar-image-target]")
      .addEventListener("targetLost", () => {
        mensaje.textContent = "Apunta la cámara a la foto 📷";
        video.pause();
      });
  </script>

</body>
</html>
